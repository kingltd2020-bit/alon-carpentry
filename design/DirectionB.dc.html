<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    .b h1, .b h2, .b p, .b ul, .b li { margin: 0; }
    .b ul { list-style: none; padding: 0; }
    a { color: #2E4A5C; } a:hover { color: #1B2E3A; }
  </style>
</helmet>

<div class="b" dir="rtl" style="width: 390px; height: 844px; background: #FBFAF7; background-image: linear-gradient(#E4E7E4 1px, transparent 1px), linear-gradient(90deg, #E4E7E4 1px, transparent 1px); background-size: 26px 26px; color: #1B2E3A; font-family: system-ui, -apple-system, Segoe UI, Noto Sans Hebrew, Arial, sans-serif; direction: rtl; box-sizing: border-box; padding: 28px 22px;">

  <div style="display: flex; flex-direction: column; gap: 20px;">

    <div style="display: flex; align-items: baseline; gap: 10px; border-bottom: 2px solid #1B2E3A; padding-bottom: 10px;">
      <span style="font-size: 27px; font-weight: 700; letter-spacing: -0.5px;">אלון</span>
      <span style="font-size: 12px; letter-spacing: 2px; color: #5E7183;">נגרות בהתאמה אישית</span>
    </div>

    <div style="display: flex; gap: 8px; font-size: 11px; color: #5E7183; letter-spacing: 0.6px;">
      <span>פרדס חנה</span><span>/</span><span>מ־2017</span><span>/</span><span>עובד לבד</span>
    </div>

    <h1 style="font-size: 30px; line-height: 1.25; font-weight: 700;">
      רהיטים בהזמנה אישית,<br>לפי המידות שלך
    </h1>

    <div style="display: flex; flex-direction: column; gap: 0; border: 1px solid #C4CDD4; background: rgba(255,255,255,0.72);">
      <div style="display: flex; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #E1E6EA; font-size: 14px;">
        <span style="color: #5E7183;">ייצור</span><span style="font-weight: 600;">3–6 שבועות</span>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid #E1E6EA; font-size: 14px;">
        <span style="color: #5E7183;">אחריות</span><span style="font-weight: 600;">שנתיים</span>
      </div>
      <div style="display: flex; justify-content: space-between; padding: 12px 14px; font-size: 14px;">
        <span style="color: #5E7183;">הרכבה</span><span style="font-weight: 600;">כלולה במחיר</span>
      </div>
    </div>

    <div style="height: 158px; border: 1px dashed #A9B6C0; display: flex; align-items: center; justify-content: center; font-size: 12px; color: #7C8B97;">
      [ מקום שמור לתמונה ]
    </div>

    <ul style="display: flex; flex-direction: column; gap: 1px;">
      <li style="font-size: 16px; padding: 11px 0; border-bottom: 1px solid #D7DEE3;">שולחנות אוכל וסלון</li>
      <li style="font-size: 16px; padding: 11px 0; border-bottom: 1px solid #D7DEE3;">ארונות ומזנונים</li>
      <li style="font-size: 16px; padding: 11px 0; border-bottom: 1px solid #D7DEE3;">ספריות וקירות אחסון</li>
    </ul>

    <div style="display: flex; align-items: center; justify-content: center; height: 50px; background: #1B2E3A; color: #FBFAF7; font-size: 16px; font-weight: 600;">
      לכתוב לאלון מה צריך
    </div>

  </div>
</div>
</x-dc>
</body>
</html>
